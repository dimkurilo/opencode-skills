<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mmBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c1207"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#mmBg)" rx="14"/>

  <text x="60" y="70" fill="#fbbf24" font-size="13" font-weight="600" letter-spacing="2">MULTI-MODEL-ORCHESTRATION</text>
  <text x="60" y="108" fill="#e2e8f0" font-size="32" font-weight="700">2+ models, independent perspectives</text>
  <text x="60" y="138" fill="#94a3b8" font-size="16">writer.family ≠ reviewer.family — catches blind spots</text>

  <!-- council motif: coordinator + 4 workers -->
  <g transform="translate(820,110)" font-size="11" font-weight="600">
    <!-- connections -->
    <line x1="0" y1="0" x2="-90" y2="-60" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="90" y2="-60" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="-90" y2="60" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="90" y2="60" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <!-- coordinator center -->
    <circle cx="0" cy="0" r="34" fill="#f59e0b"/>
    <text x="0" y="-2" fill="#1c1207" text-anchor="middle" font-size="10">COORD</text>
    <text x="0" y="12" fill="#1c1207" text-anchor="middle" font-size="10">synth</text>
    <!-- workers -->
    <g transform="translate(-90,-60)"><rect x="-44" y="-14" width="88" height="28" fill="#1c1207" stroke="#f59e0b" rx="6"/><text x="0" y="4" fill="#fde68a" text-anchor="middle">Flash</text></g>
    <g transform="translate(90,-60)"><rect x="-44" y="-14" width="88" height="28" fill="#1c1207" stroke="#f59e0b" rx="6"/><text x="0" y="4" fill="#fde68a" text-anchor="middle">Qwen 3.8</text></g>
    <g transform="translate(-90,60)"><rect x="-44" y="-14" width="88" height="28" fill="#1c1207" stroke="#f59e0b" rx="6"/><text x="0" y="4" fill="#fde68a" text-anchor="middle">GLM 5.2</text></g>
    <g transform="translate(90,60)"><rect x="-44" y="-14" width="88" height="28" fill="#1c1207" stroke="#f59e0b" rx="6"/><text x="0" y="4" fill="#fde68a" text-anchor="middle">GPT-5.5</text></g>
  </g>
</svg>
