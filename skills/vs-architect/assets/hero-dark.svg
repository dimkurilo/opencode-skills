<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="vsBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#3b0a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#vsBg)" rx="14"/>

  <text x="60" y="70" fill="#f9a8d4" font-size="13" font-weight="600" letter-spacing="2">VS-ARCHITECT · VERBALIZED SAMPLING</text>
  <text x="60" y="108" fill="#e2e8f0" font-size="34" font-weight="700">Diverse variants, with probabilities</text>
  <text x="60" y="138" fill="#94a3b8" font-size="16">arXiv 2510.01171 — break mode collapse</text>

  <!-- branching variants motif -->
  <g transform="translate(700,110)">
    <!-- prompt node -->
    <rect x="-20" y="-16" width="80" height="32" fill="#ec4899" rx="6"/>
    <text x="20" y="-1" fill="#3b0a2e" text-anchor="middle" font-size="11" font-weight="700">prompt</text>
    <text x="20" y="12" fill="#3b0a2e" text-anchor="middle" font-size="10">1 answer</text>

    <!-- vs node -->
    <rect x="90" y="-16" width="80" height="32" fill="none" stroke="#ec4899" stroke-width="2" rx="6"/>
    <text x="130" y="-1" fill="#f9a8d4" text-anchor="middle" font-size="11" font-weight="700">vs-arch</text>
    <text x="130" y="12" fill="#f9a8d4" text-anchor="middle" font-size="10">N variants</text>

    <line x1="60" y1="0" x2="90" y2="0" stroke="#ec4899" stroke-width="1.5"/>

    <!-- 4 branches with probability bars -->
    <g transform="translate(200,0)" font-size="11" font-weight="600">
      <line x1="0" y1="0" x2="20" y2="-55" stroke="#ec4899" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="20" y2="-18" stroke="#ec4899" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="20" y2="18" stroke="#ec4899" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="20" y2="55" stroke="#ec4899" stroke-width="1" opacity="0.6"/>

      <g transform="translate(28,-60)"><rect x="0" y="0" width="200" height="14" fill="#3b0a2e" stroke="#ec4899" rx="3"/><rect x="0" y="0" width="90" height="14" fill="#ec4899" rx="3"/><text x="210" y="11" fill="#f9a8d4">A · p=0.45</text></g>
      <g transform="translate(28,-25)"><rect x="0" y="0" width="200" height="14" fill="#3b0a2e" stroke="#ec4899" rx="3"/><rect x="0" y="0" width="60" height="14" fill="#ec4899" rx="3"/><text x="210" y="11" fill="#f9a8d4">B · p=0.30</text></g>
      <g transform="translate(28,11)"><rect x="0" y="0" width="200" height="14" fill="#3b0a2e" stroke="#ec4899" rx="3"/><rect x="0" y="0" width="36" height="14" fill="#ec4899" rx="3"/><text x="210" y="11" fill="#f9a8d4">C · p=0.18</text></g>
      <g transform="translate(28,48)"><rect x="0" y="0" width="200" height="14" fill="#3b0a2e" stroke="#ec4899" rx="3"/><rect x="0" y="0" width="14" height="14" fill="#ec4899" rx="3"/><text x="210" y="11" fill="#f9a8d4">D · p=0.07</text></g>
    </g>
  </g>
</svg>
