<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pbBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#pbBg)" rx="14"/>

  <!-- title block -->
  <text x="60" y="80" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="2">PROJECT-BOOTSTRAP</text>
  <text x="60" y="120" fill="#e2e8f0" font-size="34" font-weight="700">Agent infrastructure, in one session</text>
  <text x="60" y="150" fill="#94a3b8" font-size="16">AGENTS.md · handoff · memory · rules · scripts</text>

  <!-- file-tree motif (right) -->
  <g transform="translate(780,52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="0" y="0" width="380" height="140" fill="#020617" stroke="#312e81" rx="8"/>
    <text x="14" y="24" fill="#6366f1" font-weight="700">project/</text>
    <text x="14" y="46" fill="#cbd5e1">├─ AGENTS.md</text>
    <text x="14" y="66" fill="#cbd5e1">├─ SESSION_HANDOFF.md</text>
    <text x="14" y="86" fill="#6366f1">└─ .agents/</text>
    <text x="34" y="106" fill="#94a3b8">   ├─ memory/</text>
    <text x="34" y="126" fill="#94a3b8">   ├─ rules/</text>
    <text x="34" y="146" fill="#94a3b8">   └─ scripts/</text>
  </g>
</svg>
