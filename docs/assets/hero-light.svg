<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bgL)" stroke="#e2e8f0" stroke-width="1" rx="16"/>

  <!-- terminal cursor motif -->
  <g transform="translate(80,70)">
    <text x="0" y="0" fill="#0891b2" font-size="34" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&gt;_</text>
    <rect x="48" y="-26" width="180" height="6" fill="#0891b2" opacity="0.35" rx="3"/>
  </g>

  <!-- title -->
  <text x="80" y="160" fill="#0f172a" font-size="58" font-weight="700" letter-spacing="-1">opencode-skills</text>

  <!-- tagline -->
  <text x="80" y="200" fill="#475569" font-size="22" font-weight="400">Skills that turn an AI agent into a specialist — not a chat partner.</text>

  <!-- skill chips -->
  <g transform="translate(80,238)" font-size="15" font-weight="600">
    <g>
      <rect x="0" y="0" width="190" height="40" fill="white" stroke="#6366f1" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#6366f1"/>
      <text x="30" y="26" fill="#4338ca">project-bootstrap</text>
    </g>
    <g transform="translate(206,0)">
      <rect x="0" y="0" width="130" height="40" fill="white" stroke="#14b8a6" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#14b8a6"/>
      <text x="30" y="26" fill="#0f766e">wave-spec</text>
    </g>
    <g transform="translate(352,0)">
      <rect x="0" y="0" width="278" height="40" fill="white" stroke="#d97706" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#d97706"/>
      <text x="30" y="26" fill="#b45309">multi-model-orchestration</text>
    </g>
    <g transform="translate(646,0)">
      <rect x="0" y="0" width="160" height="40" fill="white" stroke="#db2777" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#db2777"/>
      <text x="30" y="26" fill="#be185d">vs-architect</text>
    </g>
  </g>

  <!-- corner mark -->
  <text x="1120" y="290" fill="#94a3b8" font-size="13" text-anchor="end">MIT · opencode · Grok · ZCode</text>
</svg>
