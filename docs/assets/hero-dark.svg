<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#11183a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>

  <!-- terminal cursor motif -->
  <g transform="translate(80,70)">
    <text x="0" y="0" fill="#2dd4bf" font-size="34" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&gt;_</text>
    <rect x="48" y="-26" width="180" height="6" fill="#2dd4bf" opacity="0.35" rx="3"/>
  </g>

  <!-- title -->
  <text x="80" y="160" fill="#e2e8f0" font-size="58" font-weight="700" letter-spacing="-1">opencode-skills</text>

  <!-- tagline -->
  <text x="80" y="200" fill="#94a3b8" font-size="22" font-weight="400">Skills that turn an AI agent into a specialist — not a chat partner.</text>

  <!-- skill chips -->
  <g transform="translate(80,238)" font-size="15" font-weight="600">
    <g>
      <rect x="0" y="0" width="190" height="40" fill="none" stroke="#6366f1" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#6366f1"/>
      <text x="30" y="26" fill="#c7d2fe">project-bootstrap</text>
    </g>
    <g transform="translate(206,0)">
      <rect x="0" y="0" width="130" height="40" fill="none" stroke="#2dd4bf" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#2dd4bf"/>
      <text x="30" y="26" fill="#99f6e4">wave-spec</text>
    </g>
    <g transform="translate(352,0)">
      <rect x="0" y="0" width="278" height="40" fill="none" stroke="#f59e0b" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#f59e0b"/>
      <text x="30" y="26" fill="#fde68a">multi-model-orchestration</text>
    </g>
    <g transform="translate(646,0)">
      <rect x="0" y="0" width="160" height="40" fill="none" stroke="#ec4899" stroke-width="2" rx="8"/>
      <circle cx="16" cy="20" r="5" fill="#ec4899"/>
      <text x="30" y="26" fill="#fbcfe8">vs-architect</text>
    </g>
  </g>

  <!-- corner mark -->
  <text x="1120" y="290" fill="#475569" font-size="13" text-anchor="end">MIT · opencode · Grok · ZCode</text>
</svg>
